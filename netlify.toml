# Continuous deployment for the editor (mip-builder.netlify.app).
#
# `npm run build` MUST stay a single command: it builds the runtime IIFE into
# runtime-dist/ FIRST, and src/export.ts inlines that file via `?raw`. Running
# the editor build alone would embed whatever stale runtime was on disk.
[build]
  command = "PA_BUILD=${COMMIT_REF:0:7} npm run build && cp -r runtime-dist dist/runtime-dist"
  publish = "dist"

# PA_BUILD above stamps the runtime's version banner with the deploying commit
# (vite.runtime.config.ts falls back to 'dev' when it is unset), so an exported
# playable is traceable to the build that produced it.
#
# The cp step publishes runtime-dist/ as a static path: fetchRuntimeSrc() tries
# `./runtime-dist/playable-runtime.js` before falling back to the inlined copy.
# Without it every export logs a 404 first.

[build.environment]
  NODE_VERSION = "22"

  # Netlify's secrets scanner fails the build when an env var's value turns up in
  # the published output. Both of these are SUPPOSED to be there: Vite inlines
  # `import.meta.env.VITE_*` into the client bundle at build time, and the browser
  # needs them to reach Supabase at all (src/cloud/supabase.ts). The anon key is a
  # public credential by design — share links are guarded by the `shares` bucket's
  # RLS policy and unguessable codes, not by keeping the key secret. Set the two
  # values in Site configuration -> Environment variables; without them the build
  # still succeeds and the editor just hides its cloud features.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# Deliberately NO catch-all SPA redirect. The editor has no client-side router
# (index.html / runtime-frame.html / demo.html are real files), and a
# `/* -> /index.html 200` rule would make the runtime-dist fetch above return
# HTML with `r.ok === true` — silently exporting playables whose "runtime" is
# the editor's index page.
